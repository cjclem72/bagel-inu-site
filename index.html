
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$BAGEL — No Rug. Just Roll.</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      animation: fadeIn 1.5s ease-in;
      position: relative;
      z-index: 0;
      margin: 0;
      font-family: 'Rubik', sans-serif;
      background: url('https://www.transparenttextures.com/patterns/bagel.png') repeat;
      backdrop-filter: blur(4px);
      color: #222;
    }
    header {
      animation: fadeSlideDown 1.2s ease-out;
      background: #ffcf7e;
      padding: 2rem 1rem;
      text-align: center;
    }
    header h1 {
      font-size: 2.5rem;
      margin: 0;
    }
    header p {
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    section {
      padding: 1.5rem 1rem;
      max-width: 800px;
      margin: auto;
    }
    .gallery figure {
      margin: 0 0 2rem 0;
      text-align: center;
      position: relative;
    }
    .gallery img {
      width: 100%;
      border-radius: 16px;
      transition: transform 0.4s ease, box-shadow 0.3s ease;
      animation: memePop 6s ease-in-out infinite;
    }
    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }
    .tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #222;
      color: #fff;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .gallery figure:hover .tooltip {
      opacity: 1;
    }
    .gallery figcaption {
      font-size: 0.95rem;
      margin-top: 0.5rem;
      color: #444;
    }
    .buy-button {
      display: inline-block;
      background-color: #ff7f50;
      color: white;
      font-weight: bold;
      padding: 0.75rem 1.5rem;
      margin: 1rem auto 2rem auto;
      border: none;
      border-radius: 999px;
      font-size: 1.2rem;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      animation: pulse 2s infinite;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }
    footer {
      text-align: center;
      font-size: 0.9rem;
      padding: 2rem 1rem;
      color: #666;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <h1>$BAGEL</h1>
    <p>No Rugs. Just Rolls. 🥯🛹</p>
  </header>

  <section>
    <h2>About</h2>
    <p>$BAGEL is the carb-loaded memecoin of the century. No rugs, only rolls. Born to beat the bears and fuel degens with unstoppable breakfast energy.</p>
    <div style="text-align: center;">
      <a href="https://pump.fun" target="_blank" class="buy-button">Buy $BAGEL</a>
    </div>
  </section>

  <section>
    <h2>Meme Gallery</h2>
    <div class="gallery">
      <figure>
        <span class="tooltip">Meme 1</span>
        <img src="image1.png" alt="Meme 1" />
        <figcaption>Bagel Meme 1</figcaption>
      </figure>
<figure>

        <img src="image2.png" alt="Meme 2" />
        <figcaption>Bagel Meme 2</figcaption>
      </figure>
<figure>
        <span class="tooltip">Meme 3</span>
        <img src="image3.png" alt="Meme 3" />
        <figcaption>Bagel Meme 3</figcaption>
      </figure>
<figure>
        <span class="tooltip">Meme 4</span>
        <img src="image4.png" alt="Meme 4" />
        <figcaption>Bagel Meme 4</figcaption>
      </figure>
<figure>
        <span class="tooltip">Meme 5</span>
        <img src="image5.png" alt="Meme 5" />
        <figcaption>Bagel Meme 5</figcaption>
      </figure>
<figure>
        <span class="tooltip">Meme 6</span>
        <img src="image6.png" alt="Meme 6" />
        <figcaption>Bagel Meme 6</figcaption>
      </figure>
    </div>
    <div style="text-align: center;">
      <a href="https://pump.fun" target="_blank" class="buy-button">Buy $BAGEL Now</a>

</body>
</html>
